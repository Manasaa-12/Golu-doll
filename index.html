<!DOCTYPE html>
<html lang="ta-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golu Voice Guide</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 20px; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: #fff5e6; text-align: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
.card {
  width: 100%; max-width: 500px; padding: 30px 20px;
  background: #fff; border: 3px solid #ff9933; border-radius: 25px;
  box-shadow: 0 10px 30px rgba(230,138,0,.15);
}
h1 { margin: 0 0 8px; color: #d35400; font-size: 30px; }
.subtitle { margin: 0 0 24px; color: #666; font-size: 16px; line-height: 1.5; }
#micButton {
  width: 150px; height: 150px; border: 0; border-radius: 50%;
  background: linear-gradient(135deg, #ff9933, #d35400);
  color: #fff; font-size: 56px; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  box-shadow: 0 8px 25px rgba(211,84,0,.4);
}
#micButton:active { transform: scale(.93); }
#micButton.listening {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  animation: pulse 1.2s infinite;
}
@keyframes pulse { 50% { transform: scale(1.06); } }
#instruction { margin-top: 14px; color: #ff9933; font-size: 17px; font-weight: bold; }
#output {
  min-height: 110px; margin-top: 16px; padding: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #800000; font-size: 28px; font-weight: bold; line-height: 1.4;
  overflow-wrap: anywhere;
}
#output small { margin-top: 4px; color: #a65; font-size: 17px; font-weight: normal; }
#output .num { color: #ff9933; font-size: 18px; margin-bottom: 2px; }
#hearBtn {
  display: none; margin: 0 auto 10px; padding: 14px 26px;
  border: 0; border-radius: 12px; background: #d35400; color: #fff;
  font-size: 18px; font-weight: bold; cursor: pointer;
}
#status { min-height: 20px; margin-top: 6px; color: #888; font-size: 13px; line-height: 1.5; }
.hint { margin-top: 16px; color: #999; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>🪔 Golu Voice Guide 🪔</h1>
  <p class="subtitle">Tap the microphone and say a doll number from 1 to 31.</p>

  <button id="micButton" type="button" aria-label="Start listening">🎤</button>
  <div id="instruction">Tap to Ask</div>
  <div id="output">Tap the microphone to begin...</div>
  <button id="hearBtn" type="button">🔊 Hear it again</button>
  <div id="status"></div>

  <div class="hint">Tip: say “number one”, “number ten”, “number twenty one”.<br>Turn up your volume and switch off silent mode.</div>
</div>

<script>
/* Tamil is spoken; English is shown on screen */
const dolls = {
  "1":  { ta: "ஆண்டாள் ரங்கமன்னார்", en: "Andal and Rangamannar" },
  "2":  { ta: "பூரி ஜெகன்னாதர்", en: "Puri Jagannath" },
  "3":  { ta: "கர்பாரக்ஷாம்பிகை", en: "Garbharakshambigai" },
  "4":  { ta: "லலிதாம்பிகை", en: "Goddess Lalithambigai" },
  "5":  { ta: "கமலாம்பிகை", en: "Goddess Kamalambigai" },
  "6":  { ta: "கொலாப்பூர் மகாலட்சுமி", en: "Kolhapur Mahalakshmi" },
  "7":  { ta: "பூவராகப்பெருமாள்", en: "Lord Bhuvaraha Perumal" },
  "8":  { ta: "உலகளந்த பெருமாள்", en: "Ulagalanda Perumal" },
  "9":  { ta: "புவனேஸ்வரி அம்மன்", en: "Goddess Bhuvaneshwari" },
  "10": { ta: "வைரமுடி பெருமாள்", en: "Vairamudi Perumal" },
  "11": { ta: "குலசை முத்தாரம்மன் ஞானமூர்த்தீஸ்வரர்", en: "Kulasai Mutharamman and Gnanamoorthiswarar" },
  "12": { ta: "நவகுஞ்சரம்", en: "Navagunjara" },
  "13": { ta: "அய்யனார் பூர்ணகலா புஷ்கலா", en: "Ayyanar, Poornakala and Pushkala" },
  "14": { ta: "பிரத்யங்கிரா தேவி", en: "Goddess Pratyangira" },
  "15": { ta: "திருவண்ணாமலை அண்ணாமலையப்பன் உண்ணாமலையம்மன்", en: "Annamalaiyar and Unnamulai Amman" },
  "16": { ta: "வாராஹி அம்மன்", en: "Goddess Varahi" },
  "17": { ta: "தத்தாத்ரேயர்", en: "Lord Dattatreya" },
  "18": { ta: "திருநெல்வேலி நெல்லையப்பர் காந்திமதி", en: "Nellaiappar and Gandhimathi Amman" },
  "19": { ta: "அர்த்தநாரீஸ்வரர்", en: "Lord Ardhanareeswarar" },
  "20": { ta: "சரபேஸ்வரர்", en: "Lord Sarabeshwarar" },
  "21": { ta: "தன்வந்திரி", en: "Lord Dhanvantari" },
  "22": { ta: "பாண்டுரங்கன் ருக்மணி", en: "Panduranga and Rukmini" },
  "23": { ta: "கஜேந்திர மோட்சம்", en: "Gajendra Moksha" },
  "24": { ta: "ஏஜிபுரா விஸ்வரூப பெருமாள்", en: "Ejipura Vishwaroopa Perumal" },
  "25": { ta: "ஆதிசங்கரர்", en: "Adi Shankaracharya" },
  "26": { ta: "பாலாம்பிகை", en: "Goddess Balambigai" },
  "27": { ta: "மகாபெரியவா", en: "Mahaperiyava" },
  "28": { ta: "காசி விசாலாட்சி", en: "Kashi Vishalakshi" },
  "29": { ta: "கன்னியாகுமரி அம்மன்", en: "Goddess Kanyakumari" },
  "30": { ta: "காஞ்சி காமாக்ஷி", en: "Goddess Kanchi Kamakshi" },
  "31": { ta: "கொல்கத்தா காளி", en: "Goddess Kali of Kolkata" }
};

/* Number words 1-31, plus sound-alikes the microphone often returns */
const numberNames = [
  "one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen",
  "eighteen","nineteen","twenty","twenty one","twenty two","twenty three",
  "twenty four","twenty five","twenty six","twenty seven","twenty eight",
  "twenty nine","thirty","thirty one"
];
const words = {
  won: "1", wan: "1", to: "2", too: "2", tu: "2", tree: "3", free: "3",
  for: "4", fore: "4", fife: "5", sex: "6", sick: "6", sicks: "6", ate: "8"
};
numberNames.forEach(function (w, i) { words[w] = String(i + 1); });

const BOOST = 3;   /* online voice loudness: 1 = normal, 3 = three times louder */

const micButton = document.getElementById("micButton");
const instruction = document.getElementById("instruction");
const output = document.getElementById("output");
const hearBtn = document.getElementById("hearBtn");
const statusEl = document.getElementById("status");

let listening = false;
let lastNum = null;
let voiceStarted = false;
let voices = [];
let currentAudio = null;
let audioCtx = null;

function setStatus(t) { statusEl.innerText = t; console.log(t); }

/* ---------- Voices installed on the device ---------- */
function loadVoices() {
  if (window.speechSynthesis) voices = window.speechSynthesis.getVoices();
}
if (window.speechSynthesis) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function langOf(v) { return v.lang.replace("_", "-").toLowerCase(); }
function isMale(v) { return v.name.toLowerCase().includes("valluvar"); }

function pickTamilVoice() {
  const tamil = voices.filter(function (v) { return langOf(v).startsWith("ta"); });
  return tamil.find(function (v) { return !isMale(v); }) || tamil[0] || null;
}
function pickEnglishVoice() {
  const indian = voices.filter(function (v) { return langOf(v) === "en-in"; });
  return indian.find(function (v) { return !isMale(v); }) || indian[0] || null;
}

function stopAll() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
}

/* ---------- Last resort: English name ---------- */
function speakEnglish(item) {
  const synth = window.speechSynthesis;
  if (!synth) return;
  const v = pickEnglishVoice();
  const u = new SpeechSynthesisUtterance(item.en);
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "en-IN"; }
  u.volume = 1; u.rate = 0.9;
  u.onstart = function () { voiceStarted = true; };
  synth.speak(u);
  setStatus("Tamil voice unavailable – spoke English instead");
}

/* ---------- Tamil voice from the internet (boosted volume) ---------- */
function speakOnline(item) {
  const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ta&q=" +
              encodeURIComponent(item.ta);

  function playPlain() {
    const a = new Audio(url);
    a.volume = 1;
    currentAudio = a;
    a.onplaying = function () { voiceStarted = true; setStatus("Voice: Tamil (online)"); };
    a.onerror = function () { speakEnglish(item); };
    const p = a.play();
    if (p && p.catch) p.catch(function () { speakEnglish(item); });
  }

  try {
    const a = new Audio();
    a.crossOrigin = "anonymous";
    a.src = url;
    currentAudio = a;

    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();

    const source = audioCtx.createMediaElementSource(a);
    const gain = audioCtx.createGain();
    gain.gain.value = BOOST;
    source.connect(gain);
    gain.connect(audioCtx.destination);

    a.onplaying = function () { voiceStarted = true; setStatus("Voice: Tamil (online, boosted)"); };
    a.onerror = function () { playPlain(); };
    const p = a.play();
    if (p && p.catch) p.catch(function () { playPlain(); });
  } catch (err) {
    playPlain();
  }
}

/* ---------- Main speak function ---------- */
function speakNow(num) {
  const item = dolls[num];
  voiceStarted = false;
  stopAll();
  loadVoices();

  const tv = pickTamilVoice();
  if (tv && window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(item.ta);
    u.voice = tv;
    u.lang = tv.lang;
    u.volume = 1;
    u.rate = 0.85;
    u.pitch = 1.05;
    u.onstart = function () { voiceStarted = true; setStatus("Voice: " + tv.name); };
    u.onerror = function () { speakOnline(item); };
    window.speechSynthesis.speak(u);
    setTimeout(function () {
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
    }, 100);
  } else {
    speakOnline(item);
  }
}

function showAnswer(num) {
  const d = dolls[num];
  lastNum = num;
  output.innerHTML = "";
  const n = document.createElement("span");
  n.className = "num";
  n.textContent = "Number " + num;
  output.appendChild(n);
  output.appendChild(document.createTextNode(d.ta));
  const s = document.createElement("small");
  s.textContent = d.en;
  output.appendChild(s);
  hearBtn.style.display = "inline-block";
}

hearBtn.addEventListener("click", function () {
  if (lastNum) speakNow(lastNum);
});

/* ---------- Find the number (handles "twenty one", "thirty one", digits) ---------- */
function findNumber(texts) {
  for (const text of texts) {
    const tokens = text.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
    for (let i = 0; i < tokens.length; i++) {
      if (/^\d+$/.test(tokens[i]) && dolls[tokens[i]]) return tokens[i];
      for (let size = 2; size >= 1; size--) {
        const phrase = tokens.slice(i, i + size).join(" ");
        if (Object.prototype.hasOwnProperty.call(words, phrase) && dolls[words[phrase]]) {
          return words[phrase];
        }
      }
    }
  }
  return null;
}

/* ---------- Recognition ---------- */
function reset() {
  listening = false;
  micButton.classList.remove("listening");
  instruction.innerText = "Tap to Ask";
}

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    output.innerText = "Voice recognition is not supported. Please use Google Chrome.";
    return;
  }
  stopAll();

  /* Create the audio engine now, while the tap is fresh, so sound works later */
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !audioCtx) audioCtx = new AC();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (err) {}

  const rec = new SR();
  rec.lang = "en-IN";
  rec.continuous = false;
  rec.interimResults = true;
  rec.maxAlternatives = 5;

  let answered = false;
  let gotAnything = false;
  let timer = null;

  function commit(n) {
    if (answered) return;
    answered = true;
    clearTimeout(timer);
    showAnswer(n);
    speakNow(n);
    try { rec.stop(); } catch (err) {}
  }

  rec.onstart = function () {
    listening = true;
    micButton.classList.add("listening");
    instruction.innerText = "Listening...";
    output.innerText = "🎤 Say the number...";
    hearBtn.style.display = "none";
    setStatus("Mic: listening");
  };

  rec.onresult = function (e) {
    gotAnything = true;
    const heard = [];
    for (let i = 0; i < e.results.length; i++) {
      for (let j = 0; j < e.results[i].length; j++) heard.push(e.results[i][j].transcript);
    }
    setStatus('Heard: "' + heard[0] + '"');
    if (answered) return;

    const n = findNumber(heard);
    const isFinal = e.results[e.results.length - 1].isFinal;
    clearTimeout(timer);

    if (n && isFinal) {
      commit(n);
    } else if (n) {
      /* Wait briefly in case more is coming ("twenty" -> "twenty one") */
      timer = setTimeout(function () { commit(n); }, 900);
    } else if (isFinal) {
      answered = true;
      output.innerText = "Please say a number from 1 to 31.";
    }
  };

  rec.onerror = function (e) {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") output.innerText = "Please allow microphone access.";
    else if (e.error === "no-speech") output.innerText = "I didn't hear you. Please try again.";
    else output.innerText = "Microphone error. Please try again.";
    setStatus("Mic error: " + e.error);
  };

  rec.onend = function () {
    reset();
    /* If a number was heard but the timer hadn't fired yet, answer now */
    if (!answered && timer) {
      /* handled by the pending timer */
      return;
    }
    if (!gotAnything) {
      if (!/^(Please|I didn)/.test(output.innerText)) output.innerText = "I didn't catch that. Say “Number 1”.";
      return;
    }
    if (answered && lastNum) {
      setTimeout(function () { if (!voiceStarted) speakNow(lastNum); }, 800);
    }
  };

  try { rec.start(); } catch (err) { setStatus("Start error"); reset(); }
}

micButton.addEventListener("click", function () {
  if (!listening) startListening();
});
</script>
</body>
</html>
